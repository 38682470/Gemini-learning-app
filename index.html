<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Learning App</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-gold: #d97706;
            --accent-gold-hover: #b45309;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #475569;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--accent-gold);
            margin-bottom: 5px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background-color: var(--accent-gold);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-gold-hover);
        }

        button.secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        button.secondary:hover {
            background-color: var(--bg-card);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-content {
            background-color: var(--bg-secondary);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            border: 1px solid var(--border);
        }

        textarea {
            width: 100%;
            height: 200px;
            background-color: var(--bg-primary);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            font-family: monospace;
            resize: vertical;
            margin-bottom: 15px;
        }

        .card-list {
            margin-top: 20px;
        }

        .card-item {
            background-color: var(--bg-card);
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .instructions {
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gemini Learning App</h1>
        <p style="color: var(--text-muted);">Feynman SRS Studio</p>
    </header>

    <div class="container">
        <div class="controls">
            <button onclick="openModal('addModal')">+ Add Card</button>
            <button onclick="openModal('bulkModal')">Bulk Import</button>
            <button class="secondary" onclick="clearAllCards()">Clear All</button>
        </div>

        <h3>Your Flashcards (<span id="cardCount">0</span>)</h3>
        <div id="cardList" class="card-list">
            <p class="instructions">No flashcards added yet. Use "Add Card" or "Bulk Import" to get started.</p>
        </div>
    </div>

    <!-- Bulk Import Modal -->
    <div id="bulkModal" class="modal">
        <div class="modal-content">
            <h2>Bulk Import Flashcards</h2>
            <p class="instructions">Paste your flashcards below using the format:<br>
            <code>Question | Answer</code> (one card per line)</p>
            <textarea id="bulkInput" placeholder="What year was Jean Valjean released? | 1815
What does the yellow passport symbolize? | Brands him as an ex-convict"></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="secondary" onclick="closeModal('bulkModal')">Cancel</button>
                <button onclick="processBulkImport()">Import Cards</button>
            </div>
        </div>
    </div>

    <!-- Single Add Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h2>Add Single Flashcard</h2>
            <input type="text" id="singleQuestion" placeholder="Question / Prompt" style="width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: var(--bg-primary); color: white; border: 1px solid var(--border); border-radius: 6px;">
            <input type="text" id="singleAnswer" placeholder="Answer" style="width: 100%; padding: 10px; margin-bottom: 15px; box-sizing: border-box; background: var(--bg-primary); color: white; border: 1px solid var(--border); border-radius: 6px;">
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button class="secondary" onclick="closeModal('addModal')">Cancel</button>
                <button onclick="addSingleCard()">Add</button>
            </div>
        </div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('gemini_flashcards')) || [];

        function saveAndRender() {
            localStorage.setItem('gemini_flashcards', JSON.stringify(cards));
            const listEl = document.getElementById('cardList');
            document.getElementById('cardCount').innerText = cards.length;

            if (cards.length === 0) {
                listEl.innerHTML = '<p class="instructions">No flashcards added yet. Use "Add Card" or "Bulk Import" to get started.</p>';
                return;
            }

            listEl.innerHTML = cards.map((c, i) => `
                <div class="card-item">
                    <div>
                        <strong>Q: ${escapeHtml(c.question)}</strong><br>
                        <small style="color: var(--text-muted);">A: ${escapeHtml(c.answer)}</small>
                    </div>
                    <button class="secondary" style="color: var(--danger);" onclick="deleteCard(${i})">Delete</button>
                </div>
            `).join('');
        }

        function openModal(id) {
            document.getElementById(id).style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function processBulkImport() {
            const rawText = document.getElementById('bulkInput').value.trim();
            if (!rawText) return;

            const lines = rawText.split('\n');
            let addedCount = 0;

            lines.forEach(line => {
                if (line.includes('|')) {
                    const [q, a] = line.split('|');
                    if (q.trim() && a.trim()) {
                        cards.push({ question: q.trim(), answer: a.trim() });
                        addedCount++;
                    }
                }
            });

            document.getElementById('bulkInput').value = '';
            closeModal('bulkModal');
            saveAndRender();
        }

        function addSingleCard() {
            const q = document.getElementById('singleQuestion').value.trim();
            const a = document.getElementById('singleAnswer').value.trim();

            if (q && a) {
                cards.push({ question: q, answer: a });
                document.getElementById('singleQuestion').value = '';
                document.getElementById('singleAnswer').value = '';
                closeModal('addModal');
                saveAndRender();
            }
        }

        function deleteCard(index) {
            cards.splice(index, 1);
            saveAndRender();
        }

        function clearAllCards() {
            if (confirm('Are you sure you want to delete all cards?')) {
                cards = [];
                saveAndRender();
            }
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Initial load
        saveAndRender();
    </script>
</body>
</html>
